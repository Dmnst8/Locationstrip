<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسار نهدي اليوم</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --green: #00b07c;
    --green-dark: #007d58;
    --green-light: #e6f7f2;
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1a1a2e;
    --muted: #6b7280;
    --border: #e5e7eb;
    --done-bg: #f0fdf4;
    --done-border: #bbf7d0;
    --shadow: 0 2px 12px rgba(0,0,0,0.07);
  }

  body {
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 40px;
  }

  header {
    background: var(--green);
    color: white;
    padding: 20px 16px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,176,124,0.25);
  }

  header h1 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .header-sub {
    font-size: 13px;
    opacity: 0.85;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }

  .progress-bar {
    margin-top: 12px;
    background: rgba(255,255,255,0.3);
    border-radius: 10px;
    height: 6px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: white;
    border-radius: 10px;
    transition: width 0.4s ease;
  }

  .container {
    max-width: 600px;
    margin: 0 auto;
    padding: 16px 12px;
  }

  .section-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--muted);
    text-transform: uppercase;
    padding: 8px 4px 6px;
    margin-top: 8px;
  }

  .stop-card {
    background: var(--card);
    border-radius: 14px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
    border: 1.5px solid var(--border);
    overflow: hidden;
    transition: all 0.2s ease;
    cursor: pointer;
  }

  .stop-card:active { transform: scale(0.98); }

  .stop-card.done {
    background: var(--done-bg);
    border-color: var(--done-border);
    opacity: 0.75;
  }

  .stop-main {
    display: flex;
    align-items: center;
    padding: 14px 14px;
    gap: 12px;
  }

  .stop-num {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--green);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 15px;
    flex-shrink: 0;
    transition: background 0.2s;
    position: relative;
  }

  .done .stop-num {
    background: #16a34a;
  }

  .done .stop-num::after {
    content: '✓';
    position: absolute;
    font-size: 16px;
  }

  .done .stop-num span { opacity: 0; }

  .stop-info { flex: 1; }

  .stop-name {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 3px;
  }

  .stop-meta {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  .dist-badge {
    background: var(--green-light);
    color: var(--green-dark);
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 600;
    font-size: 12px;
  }

  .stop-card.done .dist-badge {
    background: #dcfce7;
    color: #15803d;
  }

  .stop-actions {
    display: flex;
    border-top: 1px solid var(--border);
  }

  .done .stop-actions { border-color: var(--done-border); }

  .btn-map {
    flex: 1;
    padding: 11px;
    background: none;
    border: none;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--green-dark);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: background 0.15s;
    text-decoration: none;
  }

  .btn-map:hover { background: var(--green-light); }

  .btn-done {
    padding: 11px 16px;
    background: none;
    border: none;
    border-right: 1px solid var(--border);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .done .btn-done {
    color: #16a34a;
    border-color: var(--done-border);
  }

  .btn-done:hover { background: #f0fdf4; color: #16a34a; }

  .summary-card {
    background: var(--green);
    color: white;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .summary-stat {
    flex: 1;
    min-width: 80px;
    text-align: center;
  }

  .summary-stat .val {
    font-size: 22px;
    font-weight: 700;
  }

  .summary-stat .lbl {
    font-size: 11px;
    opacity: 0.85;
    margin-top: 2px;
  }

  .end-badge {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    color: white;
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    border: none;
    box-shadow: var(--shadow);
  }

  .end-icon {
    width: 36px;
    height: 36px;
    background: var(--green);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .end-info { flex: 1; }
  .end-name { font-size: 15px; font-weight: 700; }
  .end-sub { font-size: 12px; opacity: 0.7; margin-top: 2px; }
</style>
</head>
<body>

<header>
  <h1>🗺️ مسار نهدي اليوم</h1>
  <div class="header-sub">
    <span id="done-count">0 / 21 محطة</span>
    <span id="km-remaining">• 0 كم متبقي</span>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="progress" style="width:0%"></div>
  </div>
</header>

<div class="container">

  <div class="summary-card">
    <div class="summary-stat">
      <div class="val">21</div>
      <div class="lbl">محطة</div>
    </div>
    <div class="summary-stat">
      <div class="val" id="total-km">~</div>
      <div class="lbl">كم إجمالي</div>
    </div>
    <div class="summary-stat">
      <div class="val">الدمام</div>
      <div class="lbl">البداية</div>
    </div>
    <div class="summary-stat">
      <div class="val">الخبر</div>
      <div class="lbl">النهاية</div>
    </div>
  </div>

  <div id="stops-container"></div>

  <div class="section-label">🏁 نهاية الرحلة</div>
  <div class="end-badge">
    <div class="end-icon">🏁</div>
    <div class="end-info">
      <div class="end-name">الخبر + العزيزية</div>
      <div class="end-sub">ختام الرحلة</div>
    </div>
  </div>

</div>

<script>
const YOUR_LAT = 26.3917, YOUR_LNG = 50.0349;

const stops = [
  { name: "الصمود",    lat: 26.4071, lng: 50.0364, area: "دمام" },
  { name: "الإرادة",   lat: 26.391002, lng: 50.037429, area: "دمام" },
  { name: "العمق",     lat: 26.558716, lng: 50.053618, area: "شمال" },
  { name: "الاتحاد",   lat: 26.568367, lng: 50.008734, area: "شمال" },
  { name: "الصفوة",    lat: 26.650827, lng: 49.956128, area: "شمال" },
  { name: "رأس تنورة", lat: 26.704148, lng: 50.067670, area: "شمال" },
  { name: "مفتي",      lat: 26.361542, lng: 50.194997, area: "خبر شمال" },
  { name: "ماربيلا",   lat: 26.337674, lng: 50.153132, area: "خبر" },
  { name: "القطوف",    lat: 26.335238, lng: 50.191207, area: "خبر" },
  { name: "العزوة",    lat: 26.322389, lng: 50.158432, area: "خبر" },
  { name: "مشاري",     lat: 26.309453, lng: 50.222935, area: "خبر" },
  { name: "النافع",    lat: 26.307146, lng: 50.210071, area: "خبر" },
  { name: "الرسالة",   lat: 26.305886, lng: 50.169864, area: "خبر" },
  { name: "البشاشة",   lat: 26.298361, lng: 50.178444, area: "خبر" },
  { name: "الأنيقة",   lat: 26.291041, lng: 50.219815, area: "خبر" },
  { name: "تيماء",     lat: 26.290169, lng: 50.199171, area: "خبر" },
  { name: "العطاء",    lat: 26.286439, lng: 50.190604, area: "خبر جنوب" },
  { name: "العناق",    lat: 26.208922, lng: 50.190949, area: "جنوب" },
  { name: "الأثير",    lat: 26.214513, lng: 50.207306, area: "جنوب" },
  { name: "الزعامة",   lat: 26.176101, lng: 50.162387, area: "جنوب" },
  { name: "الجمالية",  lat: 26.289, lng: 50.213, area: "خبر" },
];

function dist(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// Calculate cumulative distances
let cumDist = 0;
let prevLat = YOUR_LAT, prevLng = YOUR_LNG;
const dists = [];
let totalKm = 0;

stops.forEach((s, i) => {
  const d = dist(prevLat, prevLng, s.lat, s.lng);
  cumDist += d;
  dists.push({ fromPrev: d, cumulative: cumDist });
  totalKm += d;
  prevLat = s.lat; prevLng = s.lng;
});

document.getElementById('total-km').textContent = '~' + Math.round(totalKm) + ' كم';

const done = new Set(JSON.parse(localStorage.getItem('nahdi_done') || '[]'));

function mapsUrl(lat, lng, name) {
  return `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
}

function groupLabel(area, prev) {
  const groups = {
    "دمام": "📍 الدمام — ابدأ من هنا",
    "شمال": "⬆️ الشمال — رأس تنورة",
    "خبر شمال": "⬇️ العودة جنوباً — الخبر",
    "خبر": null,
    "خبر جنوب": null,
    "جنوب": "⬇️ أقصى الجنوب",
  };
  if (area !== prev && groups[area] !== null) return groups[area];
  return null;
}

function render() {
  const container = document.getElementById('stops-container');
  container.innerHTML = '';
  let prevArea = '';

  stops.forEach((s, i) => {
    const label = groupLabel(s.area, prevArea);
    if (label) {
      const lDiv = document.createElement('div');
      lDiv.className = 'section-label';
      lDiv.textContent = label;
      container.appendChild(lDiv);
    }
    prevArea = s.area;

    const isDone = done.has(i);
    const d = dists[i];

    const card = document.createElement('div');
    card.className = 'stop-card' + (isDone ? ' done' : '');
    card.innerHTML = `
      <div class="stop-main">
        <div class="stop-num"><span>${i+1}</span></div>
        <div class="stop-info">
          <div class="stop-name">${s.name}</div>
          <div class="stop-meta">
            <span class="dist-badge">${d.fromPrev < 1 ? Math.round(d.fromPrev*1000)+'م' : d.fromPrev.toFixed(1)+' كم'} من السابق</span>
            <span>${s.area}</span>
          </div>
        </div>
      </div>
      <div class="stop-actions">
        <button class="btn-done" onclick="toggleDone(${i}, event)">${isDone ? '✓ تمت الزيارة' : 'تم'}</button>
        <a class="btn-map" href="${mapsUrl(s.lat, s.lng, s.name)}" target="_blank" onclick="event.stopPropagation()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          افتح في الخريطة
        </a>
      </div>
    `;
    container.appendChild(card);
  });

  updateProgress();
}

function toggleDone(i, e) {
  e.stopPropagation();
  if (done.has(i)) done.delete(i); else done.add(i);
  localStorage.setItem('nahdi_done', JSON.stringify([...done]));
  render();
}

function updateProgress() {
  const n = done.size;
  const total = stops.length;
  document.getElementById('done-count').textContent = `${n} / ${total} محطة`;
  document.getElementById('progress').style.width = (n/total*100) + '%';

  // remaining km from last done stop
  let lastDone = -1;
  done.forEach(i => { if (i > lastDone) lastDone = i; });
  let rem = 0;
  for (let i = lastDone+1; i < stops.length; i++) rem += dists[i].fromPrev;
  document.getElementById('km-remaining').textContent = `• ${Math.round(rem)} كم متبقي`;
}

render();
</script>
</body>
</html>
